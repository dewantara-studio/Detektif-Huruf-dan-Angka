<style>
  body {
    font-family: 'Quicksand', sans-serif;
    user-select: none;

    background-color: #ffffff;
    background-image: radial-gradient(#d9e6da 1.5px, transparent 1.5px);
    background-size: 20px 20px;
  }
  @keyframes mascotBounce {
    0%, 100% { transform: translateY(0) rotate(-4deg); }
    50% { transform: translateY(-7px) rotate(4deg); }
  }
  .mascot { animation: mascotBounce 2.4s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes pulseDot {
    0% { transform: scale(0.9); opacity: .9; }
    50% { transform: scale(1.25); opacity: .35; }
    100% { transform: scale(0.9); opacity: .9; }
  }
  .pulse-guide { animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes bloomIn { 0%{transform:scale(.5);opacity:0;} 70%{transform:scale(1.1);opacity:1;} 100%{transform:scale(1);} }
  .bloom-in { animation: bloomIn .4s ease-out; }
  @keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(240px) rotate(360deg); opacity: 0; }
  }
  .confetti-piece { position: absolute; top: 0; animation: confettiFall 1.5s ease-in forwards; pointer-events: none; }
  .speech-bubble { position: relative; }
  .speech-bubble::after {
    content: ''; position: absolute; left: 28px; bottom: -10px;
    border-width: 10px 10px 0 0; border-style: solid; border-color: white transparent transparent transparent;
  }
</style>

<body class="garden-bg min-h-screen text-emerald-950 flex flex-col justify-between p-2 sm:p-4 overflow-x-hidden">

<script>
  // ---------- DATASET ----------
  const ABJAD = [
    {letter:'A', word:'Apel', emoji:'🍎'}, {letter:'B', word:'Bola', emoji:'⚽'},
    {letter:'C', word:'Cicak', emoji:'🦎'}, {letter:'D', word:'Durian', emoji:'🍈'},
    {letter:'E', word:'Ember', emoji:'🪣'}, {letter:'F', word:'Flamingo', emoji:'🦩'},
    {letter:'G', word:'Gajah', emoji:'🐘'}, {letter:'H', word:'Harimau', emoji:'🐯'},
    {letter:'I', word:'Ikan', emoji:'🐟'}, {letter:'J', word:'Jeruk', emoji:'🍊'},
    {letter:'K', word:'Kucing', emoji:'🐱'}, {letter:'L', word:'Lebah', emoji:'🐝'},
    {letter:'M', word:'Monyet', emoji:'🐒'}, {letter:'N', word:'Naga', emoji:'🐉'},
    {letter:'O', word:'Ombak', emoji:'🌊'}, {letter:'P', word:'Pisang', emoji:'🍌'},
    {letter:'Q', word:'Quokka', emoji:'🐨'}, {letter:'R', word:'Rusa', emoji:'🦌'},
    {letter:'S', word:'Semut', emoji:'🐜'}, {letter:'T', word:'Topi', emoji:'🎩'},
    {letter:'U', word:'Ular', emoji:'🐍'}, {letter:'V', word:'Vas Bunga', emoji:'🏺'},
    {letter:'W', word:'Wortel', emoji:'🥕'}, {letter:'X', word:'Xilofon', emoji:'🎹'},
    {letter:'Y', word:'Yoyo', emoji:'🪀'}, {letter:'Z', word:'Zebra', emoji:'🦓'}
  ];
  const VOKAL = ABJAD.filter(i => 'AIUEO'.includes(i.letter));
  const KATA = [
    {letter:'BOLA', word:'Bola', emoji:'⚽'}, {letter:'BUKU', word:'Buku', emoji:'📚'},
    {letter:'IKAN', word:'Ikan', emoji:'🐟'}, {letter:'PADI', word:'Padi', emoji:'🌾'},
    {letter:'DAUN', word:'Daun', emoji:'🍃'}, {letter:'KUDA', word:'Kuda', emoji:'🐴'},
    {letter:'KUE', word:'Kue', emoji:'🎂'}, {letter:'MATA', word:'Mata', emoji:'👀'},
    {letter:'KAKI', word:'Kaki', emoji:'🦶'}, {letter:'SUSU', word:'Susu', emoji:'🥛'},
    {letter:'ROTI', word:'Roti', emoji:'🍞'}, {letter:'BAJU', word:'Baju', emoji:'👕'},
    {letter:'MOBIL', word:'Mobil', emoji:'🚗'}, {letter:'SAPI', word:'Sapi', emoji:'🐄'},
    {letter:'AYAM', word:'Ayam', emoji:'🐔'}
  ];
  const ANGKA = [
    {letter:'1', word:'Satu', emoji:'1️⃣'}, {letter:'2', word:'Dua', emoji:'2️⃣'},
    {letter:'3', word:'Tiga', emoji:'3️⃣'}, {letter:'4', word:'Empat', emoji:'4️⃣'},
    {letter:'5', word:'Lima', emoji:'5️⃣'}, {letter:'6', word:'Enam', emoji:'6️⃣'},
    {letter:'7', word:'Tujuh', emoji:'7️⃣'}, {letter:'8', word:'Delapan', emoji:'8️⃣'},
    {letter:'9', word:'Sembilan', emoji:'9️⃣'}, {letter:'10', word:'Sepuluh', emoji:'🔟'}
  ];
  const DATASETS = { vokal: VOKAL, abjad: ABJAD, kata: KATA, angka: ANGKA };

  // ---------- STATE ----------
  let currentMode = 'vokal';
  let currentIndex = 0;
  let isDrawing = false;
  let lastPoint = { x: 0, y: 0 };
  let penColor = '#2E7D32';
  let isRainbowPen = false;
  let hue = 0;
  let starsCount = 0;
  let unlockedFlowers = new Set();
  let highContrastMode = true;
  let audioCtx = null;

  let guideCanvas, guideCtx;
  let tracingCanvas, tracingCtx;
  let maskCanvas, maskCtx;
  let totalMaskPixels = 0;

  window.onload = function () {
    guideCanvas = document.getElementById('guideCanvas');
    guideCtx = guideCanvas.getContext('2d');
    tracingCanvas = document.getElementById('tracingCanvas');
    tracingCtx = tracingCanvas.getContext('2d');
    maskCanvas = document.createElement('canvas');
    maskCtx = maskCanvas.getContext('2d');

    setupCanvasResize();
    setupEventListeners();
    loadCurrentItem();
    updateBookGrid();
  };

  function setupCanvasResize() {
    const container = document.getElementById('canvasContainer');
    const ro = new ResizeObserver(() => resizeCanvas());
    if (container) ro.observe(container);
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
  }

  function resizeCanvas() {
    const container = document.getElementById('canvasContainer');
    if (!container) return;
    const rect = container.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
      guideCanvas.width = rect.width; guideCanvas.height = rect.height;
      tracingCanvas.width = rect.width; tracingCanvas.height = rect.height;
      maskCanvas.width = rect.width; maskCanvas.height = rect.height;
      redrawCanvas();
    }
  }

  function getCurrentItem() { return DATASETS[currentMode][currentIndex]; }

  // ---------- GUIDE & MASK DRAWING ----------
  function redrawCanvas() {
    if (!guideCanvas || guideCanvas.width <= 0 || guideCanvas.height <= 0) return;
    const w = guideCanvas.width, h = guideCanvas.height;
    guideCtx.clearRect(0, 0, w, h);
    tracingCtx.clearRect(0, 0, w, h);
    maskCtx.clearRect(0, 0, w, h);

    const item = getCurrentItem();
    const text = item.letter;
    const isMultiChar = text.length > 1;
    const baseFontSize = isMultiChar
      ? Math.min(w / (text.length * 0.7), h * 0.4)
      : Math.min(w * 0.65, h * 0.75);
    const cx = w / 2, cy = h / 2;

    // Guide layer: soft fill + dashed outline
    guideCtx.textAlign = 'center';
    guideCtx.textBaseline = 'middle';
    guideCtx.font = `700 ${baseFontSize}px 'Fredoka', 'Baloo 2', sans-serif`;
    guideCtx.fillStyle = highContrastMode ? '#BFE3C4' : '#E3F1E5';
    guideCtx.fillText(text, cx, cy);
    guideCtx.lineWidth = Math.max(2.5, baseFontSize * 0.02);
    guideCtx.strokeStyle = highContrastMode ? '#3E6B42' : '#8FAE90';
    guideCtx.setLineDash([Math.max(5, baseFontSize * 0.028), Math.max(5, baseFontSize * 0.028)]);
    guideCtx.lineCap = 'round';
    guideCtx.strokeText(text, cx, cy);
    guideCtx.setLineDash([]);

    drawStartPointGuide(cx, cy, baseFontSize, text);

    // Offscreen mask for progress evaluation
    maskCtx.textAlign = 'center';
    maskCtx.textBaseline = 'middle';
    maskCtx.font = `700 ${baseFontSize}px 'Fredoka', 'Baloo 2', sans-serif`;
    maskCtx.lineWidth = Math.max(20, baseFontSize * 0.12);
    maskCtx.strokeStyle = '#000000';
    maskCtx.fillStyle = '#000000';
    maskCtx.strokeText(text, cx, cy);
    maskCtx.fillText(text, cx, cy);

    calculateTargetMaskPixels();
    updateProgressBar(0);
  }

  function drawStartPointGuide(cx, cy, fontSize, text) {
    // Titik mulai umum: pojok kiri-atas dari bentuk huruf/kata
    guideCtx.font = `700 ${fontSize}px 'Fredoka', 'Baloo 2', sans-serif`;
    const textWidth = guideCtx.measureText(text).width;
    const pt = { x: cx - textWidth * 0.42, y: cy - fontSize * 0.32 };
    const radius = Math.max(13, fontSize * 0.06);

    guideCtx.beginPath();
    guideCtx.arc(pt.x, pt.y, radius + 2, 0, Math.PI * 2);
    guideCtx.fillStyle = '#1E3A24';
    guideCtx.fill();

    guideCtx.beginPath();
    guideCtx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
    guideCtx.fillStyle = '#06D6A0';
    guideCtx.fill();

    guideCtx.fillStyle = '#FFFFFF';
    guideCtx.font = `bold ${Math.max(12, fontSize * 0.05)}px Arial, sans-serif`;
    guideCtx.fillText('1', pt.x, pt.y + 1);
  }

  // ---------- DRAWING EVENTS ----------
  function setupEventListeners() {
    tracingCanvas.addEventListener('mousedown', startDrawing);
    tracingCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);
    tracingCanvas.addEventListener('touchstart', e => { e.preventDefault(); startDrawing(e.touches[0]); }, { passive: false });
    tracingCanvas.addEventListener('touchmove', e => { e.preventDefault(); draw(e.touches[0]); }, { passive: false });
    tracingCanvas.addEventListener('touchend', e => { e.preventDefault(); stopDrawing(); }, { passive: false });
  }

  function getCanvasCoordinates(e) {
    const rect = tracingCanvas.getBoundingClientRect();
    return { x: (e.clientX || e.pageX) - rect.left, y: (e.clientY || e.pageY) - rect.top };
  }

  function startDrawing(e) {
    isDrawing = true;
    lastPoint = getCanvasCoordinates(e);
    playTone(440, 0.05, 'sine');
  }

  function draw(e) {
    if (!isDrawing) return;
    const p = getCanvasCoordinates(e);
    tracingCtx.beginPath();
    tracingCtx.moveTo(lastPoint.x, lastPoint.y);
    tracingCtx.lineTo(p.x, p.y);
    tracingCtx.lineWidth = Math.min(tracingCanvas.width, tracingCanvas.height) * 0.06;
    tracingCtx.lineCap = 'round';
    tracingCtx.lineJoin = 'round';
    if (isRainbowPen) {
      hue = (hue + 5) % 360;
      tracingCtx.strokeStyle = `hsl(${hue}, 90%, 50%)`;
    } else {
      tracingCtx.strokeStyle = penColor;
    }
    tracingCtx.stroke();
    if (Math.random() < 0.2) playTone(500 + Math.random() * 200, 0.03, 'sine');
    lastPoint = p;
  }

  function stopDrawing() {
    if (!isDrawing) return;
    isDrawing = false;
    evaluateCoverageProgress();
  }

  // ---------- PROGRESS EVALUATION ----------
  function calculateTargetMaskPixels() {
    if (!maskCanvas || maskCanvas.width <= 0 || maskCanvas.height <= 0) { totalMaskPixels = 0; return; }
    const img = maskCtx.getImageData(0, 0, maskCanvas.width, maskCanvas.height);
    let count = 0;
    for (let i = 0; i < img.data.length; i += 16) if (img.data[i + 3] > 50) count++;
    totalMaskPixels = count;
  }

  function evaluateCoverageProgress() {
    if (!tracingCanvas || tracingCanvas.width <= 0 || totalMaskPixels === 0) return;
    const w = tracingCanvas.width, h = tracingCanvas.height;
    const uImg = tracingCtx.getImageData(0, 0, w, h);
    const mImg = maskCtx.getImageData(0, 0, w, h);
    let hit = 0;
    const u = uImg.data, m = mImg.data;
    for (let i = 0; i < u.length; i += 16) if (u[i + 3] > 50 && m[i + 3] > 50) hit++;
    const required = totalMaskPixels * 0.65;
    const pct = Math.min(100, Math.round((hit / required) * 100));
    updateProgressBar(pct);
    if (pct >= 100) triggerSuccess();
  }

  function updateProgressBar(pct) {
    const fill = document.getElementById('progress-bar-fill');
    const text = document.getElementById('progress-text');
    const clamped = Math.min(100, Math.max(0, pct));
    fill.style.width = `${clamped}%`;
    text.textContent = `${clamped}%`;
  }

  function manualCheckCompletion() {
    const cur = parseInt(document.getElementById('progress-text').textContent) || 0;
    if (cur >= 40) triggerSuccess();
    else { speak('Ayo tebali sedikit lagi sampai selesai!'); playTone(250, 0.15, 'sawtooth'); }
  }

  function triggerSuccess() {
    const item = getCurrentItem();
    const label = currentMode === 'angka' ? 'angka' : 'huruf';
    playSuccessSound();
    starsCount += 3;
    document.getElementById('star-count').textContent = starsCount;
    if (currentMode !== 'kata') unlockedFlowers.add(item.letter);
    launchConfetti();
    speak(`Hebat! Ini ${label} ${item.letter}. ${item.word}!`);
    document.getElementById('success-text').textContent = `Kamu berhasil memecahkan ${label} ${item.letter}! (+3 ⭐)`;
    document.getElementById('success-overlay').classList.remove('hidden');
    document.getElementById('success-overlay').classList.add('flex');
  }

  function loadCurrentItem() {
    const item = getCurrentItem();
    document.getElementById('item-emoji').textContent = item.emoji;
    document.getElementById('item-title').textContent = currentMode === 'kata' ? item.word : (currentMode === 'angka' ? `Angka ${item.letter}` : `Huruf ${item.letter}`);
    document.getElementById('item-subtitle').textContent = `${item.letter} = ${item.word}`;
    document.getElementById('success-overlay').classList.add('hidden');
    document.getElementById('success-overlay').classList.remove('flex');
    redrawCanvas();
  }

  function nextItem() {
    currentIndex = (currentIndex + 1) % DATASETS[currentMode].length;
    loadCurrentItem();
  }

  function clearCanvas() { redrawCanvas(); }

  function switchMode(mode) {
    currentMode = mode; currentIndex = 0;
    document.querySelectorAll('.mode-tab').forEach(t => {
      t.className = 'mode-tab flex-1 min-w-[45%] sm:min-w-0 py-2 px-2 bg-white text-emerald-700 font-bold text-xs sm:text-sm rounded-2xl shadow border-2 border-emerald-200 transition hover:bg-emerald-50 active:scale-95';
    });
    document.getElementById(`tab-${mode}`).className = 'mode-tab flex-1 min-w-[45%] sm:min-w-0 py-2 px-2 bg-emerald-600 text-white font-bold text-xs sm:text-sm rounded-2xl shadow border-b-4 border-emerald-800 transition active:scale-95';
    loadCurrentItem();
  }

  function setPenColor(color) {
    if (color === 'rainbow') { isRainbowPen = true; } else { isRainbowPen = false; penColor = color; }
  }

  function toggleHighContrast() { highContrastMode = !highContrastMode; redrawCanvas(); }

  function playItemAudio() { const item = getCurrentItem(); speak(`${item.letter}. ${item.word}`); }

  // ---------- AUDIO ----------
  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID'; u.rate = 0.85; u.pitch = 1.1;
    window.speechSynthesis.speak(u);
  }
  function playTone(freq, dur, type = 'sine') {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }
  function playSuccessSound() {
    [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => playTone(f, 0.15, 'triangle'), i * 100));
  }
  function launchConfetti() {
    const stage = document.getElementById('canvasContainer');
    const pieces = ['🌸', '🌼', '✨', '🍃', '⭐'];
    for (let i = 0; i < 14; i++) {
      const el = document.createElement('span');
      el.className = 'confetti-piece text-xl';
      el.textContent = pieces[Math.floor(Math.random() * pieces.length)];
      el.style.left = `${Math.random() * 90 + 5}%`;
      el.style.animationDelay = `${Math.random() * 0.3}s`;
      stage.appendChild(el);
      setTimeout(() => el.remove(), 1700);
    }
  }

  // ---------- GARDEN BOOK ----------
  function openBook() {
    updateBookGrid();
    const modal = document.getElementById('book-modal');
    modal.classList.remove('hidden'); modal.classList.add('flex');
  }
  function closeBook() {
    const modal = document.getElementById('book-modal');
    modal.classList.add('hidden'); modal.classList.remove('flex');
  }
  function updateBookGrid() {
    const grid = document.getElementById('book-grid');
    if (!grid) return;
    grid.innerHTML = '';
    ABJAD.concat(ANGKA).forEach(item => {
      const isUnlocked = unlockedFlowers.has(item.letter);
      const card = document.createElement('div');
      card.className = `p-2 rounded-2xl flex flex-col items-center justify-center text-center transition ${isUnlocked ? 'bg-white shadow border-2 border-emerald-200' : 'bg-slate-200/60 opacity-40 grayscale'}`;
      card.innerHTML = `<span class="text-2xl sm:text-3xl mb-1">${isUnlocked ? '🔍' : '🔒'}</span>
        <span class="text-[10px] sm:text-xs font-bold text-emerald-900">${isUnlocked ? item.letter : '???'}</span>`;
      grid.appendChild(card);
    });
  }
</script>
</body>
</html>
